name: GitHub Pages

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']

permissions:
    contents: write

jobs:
    build:
        env:
            PLANT_UML_VERSION: '1.2026.2'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: recursive

            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0
              with:
                  version: 'latest'

            - name: Init enviroument
              run: |
                  pnpm i

            - name: Build
              run: |
                  pnpm build

            - name: Gen PlantUML
              run: |
                  sudo apt-get update
                  sudo apt-get install -y graphviz fonts-wqy-microhei
                  sudo fc-cache -fv
                  wget https://github.com/plantuml/plantuml/releases/download/v${{ env.PLANT_UML_VERSION }}/plantuml-${{ env.PLANT_UML_VERSION }}.jar -O plantuml.jar
                  find . -name '*.puml' -type f -print0 | xargs -0 java -Dplantuml.font.default="WenQuanYi Micro Hei" -jar plantuml.jar -tsvg -charset UTF-8
                  rm -rf plantuml.jar

            - name: Prepare push
              run: |
                  find . -name '.gitignore' -type f -print | xargs rm -rf
                  find . -type f -size +95M -delete
                  rm -rf .husky

            - name: Push Branch
              uses: actions-js/push@master
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  branch: gh-pages
                  amend: true
                  force: true
